# CI: 三端跨平台测试（Deno / Bun / Node.js 22+），验证跨运行时兼容性
# 注意：tests/web3.test.ts 含 Anvil 集成测试（需本地 http://127.0.0.1:8545 节点），
#       通过 it.skipIf(getEnv("CI") === "true") 在 CI 自动跳过（Deno/Bun/Node 均设 CI=true）。
# 注意：Deno 解析依赖图时需 --minimum-dependency-age=0 绕过 JSR 最小依赖日期约束
#       （依赖图中存在比 runtime-adapter@1.2.2 更早发布的传递依赖）。
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 工作流级 env：让基于 Node 的 GitHub Actions（如 checkout、setup-*）提前使用 Node 24 运行时，
# 便于在官方强制升级前做性能/稳定性验证。参见 GitHub 文档中的 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Deno（Linux / macOS / Windows）
  # ─────────────────────────────────────────────────────────────────────────
  test-deno:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache --minimum-dependency-age=0 src/mod.ts src/cli.ts src/setup.ts

      - name: Check
        run: deno check --minimum-dependency-age=0 src/mod.ts src/cli.ts src/setup.ts src/deploy.ts src/verify.ts

      - name: Lint
        run: deno lint src/ tests/

      - name: Test (Deno)
        env:
          CI: "true"
        run: deno test -A --minimum-dependency-age=0 --no-check tests/

  # ─────────────────────────────────────────────────────────────────────────
  # Bun（Linux / macOS / Windows）
  # ─────────────────────────────────────────────────────────────────────────
  test-bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Test (Bun)
        env:
          CI: "true"
        run: bun test tests/

  # ─────────────────────────────────────────────────────────────────────────
  # Node.js 22（Linux / macOS / Windows）
  # ─────────────────────────────────────────────────────────────────────────
  test-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Test (Node)
        run: npm run test:node
